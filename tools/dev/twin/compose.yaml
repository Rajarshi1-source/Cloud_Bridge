# CloudBridge local twin: two k3s cells behind a Cloudflare-like edge. Driven by tools/dev/twin.sh,
# which renders everything under TWIN_DIR first (k3s config, Secrets, Argo CD bootstrap, edge config,
# certificates); don't `docker compose up` this file by hand.
name: cb-twin

x-cell: &cell
  image: rancher/k3s:v1.36.5-k3s1          # = k3s_server_version (budget VMs)
  command: [server]
  privileged: true                         # k3s runs containerd, iptables and the policy controller
  tmpfs: [/run, /var/run]
  restart: unless-stopped
  mem_limit: ${CB_TWIN_CELL_MEM:-3g}       # a budget VM has 2 GiB; headroom for k3s-in-Docker
  depends_on: [twin-registry, twin-mirror, twin-git]

services:
  cell-aws:
    <<: *cell
    hostname: cb-aws-local
    volumes:
      - cell-aws:/var/lib/rancher/k3s
      - ${TWIN_DIR}/cb-aws-local/etc:/etc/rancher/k3s/twin:ro
      - ${TWIN_DIR}/cb-aws-local/manifests:/var/lib/rancher/k3s/server/manifests/cloudbridge:ro
    environment:
      K3S_CONFIG_FILE: /etc/rancher/k3s/twin/config.yaml   # names registries.yaml too (twin.yml)
    networks: [twin]

  cell-gcp:
    <<: *cell
    hostname: cb-gcp-local
    volumes:
      - cell-gcp:/var/lib/rancher/k3s
      - ${TWIN_DIR}/cb-gcp-local/etc:/etc/rancher/k3s/twin:ro
      - ${TWIN_DIR}/cb-gcp-local/manifests:/var/lib/rancher/k3s/server/manifests/cloudbridge:ro
    environment:
      K3S_CONFIG_FILE: /etc/rancher/k3s/twin/config.yaml
    networks: [twin]

  # Stands in for the Cloudflare load balancer. Config: tools/dev/twin/edge_config.py.
  edge:
    image: traefik:v3.7.14
    command:
      - --entryPoints.websecure.address=:8443
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --ping=true
      - --accessLog=true
      - --accessLog.fields.headers.names.X-CB-Cell=keep
    ports: ["127.0.0.1:${CB_TWIN_EDGE_PORT:-8443}:8443"]
    volumes:
      - ${TWIN_DIR}/edge:/dynamic:ro
      - ${TWIN_DIR}/pki:/pki:ro
    restart: unless-stopped
    networks:
      twin:
        ipv4_address: ${CB_TWIN_NET:-172.29.80}.8   # the cells' Prometheus agents reach it by IP
        aliases:                    # the allocator calls each cell's admin host, as it would in production
          - admin-aws.${CB_TWIN_DOMAIN:-cloudbridge.example}
          - admin-gcp.${CB_TWIN_DOMAIN:-cloudbridge.example}
          - app.${CB_TWIN_DOMAIN:-cloudbridge.example}   # the blackbox probe goes through the edge

  # Stands in for Cloudflare Access: turns a service token into the signed JWT the cells validate, and
  # serves the signing keys. Reuses the toolbox image for its Python and cryptography. Port 443 (plain
  # HTTP) so the cells' NetworkPolicy has the same shape as for the real team domain. Pods reach it by IP.
  twin-access:
    image: cloudbridge/ansible-toolbox:local
    command: [python3, -I, /app/access_standin.py]
    environment:
      ACCESS_ISSUER: http://${CB_TWIN_NET:-172.29.80}.7:443
      ACCESS_AUD: twin-admin
      ACCESS_ADMIN_HOSTS: admin-aws.${CB_TWIN_DOMAIN:-cloudbridge.example},admin-gcp.${CB_TWIN_DOMAIN:-cloudbridge.example}
      ACCESS_METRICS_HOST: metrics.${CB_TWIN_DOMAIN:-cloudbridge.example}
      ACCESS_METRICS_CLIENT_ID: twin-metrics.access
      ACCESS_CP_HOST: cp.${CB_TWIN_DOMAIN:-cloudbridge.example}
      ACCESS_CP_CLIENT_ID: twin-cp.access
    volumes:
      - ./access_standin.py:/app/access_standin.py:ro
      - ${TWIN_DIR}/access:/access
    restart: unless-stopped
    networks:
      twin:
        ipv4_address: ${CB_TWIN_NET:-172.29.80}.7

  # The control plane's lease allocator and its tables, with short leases so a drill takes minutes.
  twin-cp-db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: allocator
      POSTGRES_PASSWORD: allocator
      POSTGRES_DB: allocator
    volumes:
      - cp-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allocator"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    networks: [twin]

  twin-allocator:
    build: ../../../control-plane/allocator
    image: cloudbridge/allocator:local
    env_file:
      - path: ${TWIN_DIR}/access/allocator.env
        required: false
    environment:
      ALLOCATOR_DATABASE_URL: postgresql://allocator:allocator@twin-cp-db:5432/allocator
      ALLOCATOR_CELLS: '{"aws": "https://admin-aws.${CB_TWIN_DOMAIN:-cloudbridge.example}:8443", "gcp": "https://admin-gcp.${CB_TWIN_DOMAIN:-cloudbridge.example}:8443"}'
      ALLOCATOR_WEIGHTS_FILE: /weights/terraform.tfvars.json
      ALLOCATOR_INTERVAL_SECONDS: "20"
      ALLOCATOR_LEASE_TTL_SECONDS: "90"
      ALLOCATOR_MARGIN_SECONDS: "60"
      ALLOCATOR_SEED_STOCK: SKU-1=1000,SKU-2=20
      SSL_CERT_FILE: /pki/ca.crt
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../../../infra/live/global/30-traffic:/weights:ro
      - ${TWIN_DIR}/pki:/pki:ro
    depends_on:
      twin-cp-db:
        condition: service_healthy
    restart: unless-stopped
    networks: [twin]

  # The control plane's API and dashboard. Published on 127.0.0.1 like Grafana; cp.<domain> is the Access path.
  twin-api:
    build: ../../../control-plane/api
    image: cloudbridge/cp-api:local
    env_file:
      - path: ${TWIN_DIR}/control-plane/api.env
        required: false
    environment:
      CB_REPO_DIR: /repo
      CB_PROM_URL: http://prometheus:9090
      CB_ENV: local
    ports: ["127.0.0.1:${CB_TWIN_API_PORT:-8010}:8010"]
    volumes:
      - ../../../gitops:/repo/gitops:ro
      - ../../../infra/live/global/30-traffic:/repo/infra/live/global/30-traffic:ro
    mem_limit: 192m
    depends_on:
      twin-cp-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      twin:
        aliases: [control-plane-api]

  twin-dashboard:
    build: ../../../control-plane/dashboard
    image: cloudbridge/cp-dashboard:local
    env_file:
      - path: ${TWIN_DIR}/control-plane/api.env
        required: false
    environment:
      CP_API_URL: http://control-plane-api:8010
    ports: ["127.0.0.1:${CB_TWIN_DASHBOARD_PORT:-3001}:3001"]
    mem_limit: 192m
    depends_on: [twin-api]
    restart: unless-stopped
    networks: [twin]

  # Runs when asked (twin.sh), as the daily job would. No billing source is configured here, so it writes
  # only what is measured: the cells, and yesterday's requests from Prometheus.
  twin-collector:
    profiles: [jobs]
    build: ../../../control-plane/cost-collector
    image: cloudbridge/cost-collector:local
    env_file:
      - path: ${TWIN_DIR}/control-plane/api.env
        required: false
    environment:
      CB_PROM_URL: http://prometheus:9090
      CB_CELLS_FILE: /parity/cells.yaml
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../../../parity:/parity:ro
    networks: [twin]

  # The central observability stack: the configuration in observability/, unchanged. Only its secrets
  # and the address it probes are the twin's own (twin.sh writes them under TWIN_DIR/observability).
  twin-prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
    ports: ["127.0.0.1:${CB_TWIN_PROM_PORT:-9090}:9090"]
    volumes:
      - ../../../observability/prometheus:/etc/prometheus:ro
      - ${TWIN_DIR}/observability/targets:/etc/prometheus/targets:ro
      - prometheus:/prometheus
    mem_limit: 512m
    restart: unless-stopped
    networks:
      twin:
        aliases: [prometheus]

  twin-alertmanager:
    image: prom/alertmanager:v0.33.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/tmp/alertmanager
    volumes:
      - ../../../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${TWIN_DIR}/observability/slack_url:/etc/alertmanager/slack_url:ro
    mem_limit: 64m
    restart: unless-stopped
    networks:
      twin:
        aliases: [alertmanager]

  twin-blackbox:
    image: prom/blackbox-exporter:v0.29.1
    command: [--config.file=/etc/blackbox/blackbox.yml]
    environment:
      SSL_CERT_FILE: /pki/ca.crt      # trusts the twin's edge the way a real probe trusts Cloudflare's
    volumes:
      - ../../../observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - ${TWIN_DIR}/pki:/pki:ro
    mem_limit: 48m
    restart: unless-stopped
    networks:
      twin:
        aliases: [blackbox]

  twin-grafana:
    image: grafana/grafana:13.2.5
    environment:
      CP_DB_HOST: twin-cp-db:5432
      CP_DB_SSLMODE: disable
      GF_AUTH_ANONYMOUS_ENABLED: "true"   # published on 127.0.0.1 only
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    ports: ["127.0.0.1:${CB_TWIN_GRAFANA_PORT:-3000}:3000"]
    volumes:
      - ../../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${TWIN_DIR}/observability/grafana-secrets:/etc/grafana/secrets:ro
    mem_limit: 384m
    restart: unless-stopped
    networks: [twin]

  # Stands in for Slack and the Event-Driven Ansible webhook: records what Alertmanager sends.
  twin-alert-sink:
    image: cloudbridge/ansible-toolbox:local
    command: [python3, -I, /app/alert_sink.py]
    volumes:
      - ./alert_sink.py:/app/alert_sink.py:ro
      - ${TWIN_DIR}/observability/alerts:/alerts
    restart: unless-stopped
    networks:
      twin:
        aliases: [eda]

  # Argo CD in both cells follows a snapshot of this working tree (branch "twin"), so changes are
  # tested before they're pushed, and a private GitHub repo needs no token here. Smart HTTP, because
  # Argo CD's go-git client doesn't speak the dumb protocol. Pods reach it by IP: k3s CoreDNS
  # forwards to public resolvers, not Docker's embedded DNS.
  twin-git:
    build:
      dockerfile_inline: |
        FROM alpine:3.22
        RUN apk add --no-cache git git-daemon lighttpd
        RUN printf '%s\n' \
          'server.document-root = "/srv"' \
          'server.port = 80' \
          'server.modules = ("mod_alias", "mod_cgi", "mod_setenv")' \
          'alias.url = ("/git" => "/usr/libexec/git-core/git-http-backend")' \
          'cgi.assign = ("" => "")' \
          'setenv.add-environment = ("GIT_PROJECT_ROOT" => "/srv/git", "GIT_HTTP_EXPORT_ALL" => "1", "GIT_CONFIG_COUNT" => "1", "GIT_CONFIG_KEY_0" => "safe.directory", "GIT_CONFIG_VALUE_0" => "*")' \
          > /etc/lighttpd/twin.conf
        CMD ["lighttpd", "-D", "-f", "/etc/lighttpd/twin.conf"]
    image: cloudbridge/twin-git:local
    volumes:
      - ${TWIN_DIR}/git:/srv/git:ro
    restart: unless-stopped
    networks:
      twin:
        ipv4_address: ${CB_TWIN_NET:-172.29.80}.6

  # Service images built from the working tree (twin.sh images). Cells try it before the mirror.
  twin-registry:
    image: registry:3.0.0
    ports: ["127.0.0.1:${CB_TWIN_REGISTRY_PORT:-5500}:5000"]
    volumes:
      - registry:/var/lib/registry
    restart: unless-stopped
    networks: [twin]

  # One Docker Hub pull per image for both cells (the registries_mirror role's job on the VMs).
  twin-mirror:
    image: registry:3.0.0
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
      REGISTRY_LOG_LEVEL: info
    volumes:
      - mirror:/var/lib/registry
    restart: unless-stopped
    networks: [twin]

networks:
  twin:
    ipam:
      config:
        - subnet: ${CB_TWIN_NET:-172.29.80}.0/24
          # Dynamic addresses stay out of the low range: after a Docker restart a container without a
          # fixed address could otherwise take .6 or .7 and keep twin-git or twin-access from starting.
          ip_range: ${CB_TWIN_NET:-172.29.80}.128/25

volumes:
  cell-aws:
  cell-gcp:
  mirror:
  registry:
  cp-db:
  prometheus:
