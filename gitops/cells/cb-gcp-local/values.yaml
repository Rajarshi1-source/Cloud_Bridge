# Local twin of cb-gcp-budget (tools/dev/twin.sh): the same k3s, charts and ring on this machine, so
# Weeks 4-8 can be exercised without a cloud account. It must stay identical to cb-gcp-budget except
# for cell, the comments and secretStore: anything else would make the twin prove nothing.
cell: cb-gcp-local
cloud: gcp
# k3s pulls docker.io through the twin's pull-through mirror (registries.yaml written by twin.yml).
imageRegistryMirror: docker.io
secretStore: twin (generated on this machine by ansible/playbooks/twin.yml)
ingress:
  className: traefik
network:
  ingressNamespaces: [traefik]
budgetData:
  enabled: true
# Same 2 GiB budget sizing as the cloud cell, so the twin catches a cell that no longer fits.
replicas:
  min: 1
  max: 2
resourceOverrides:
  api-gateway:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 384Mi }
  order-service:
    requests: { cpu: 100m, memory: 288Mi }
    limits: { cpu: "1", memory: 416Mi }
  inventory-service:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 384Mi }
