# Defaults. Cells override only what gitops/cells/<cell>/values.yaml is allowed to differ in.
cell: ""
cloud: ""
domain: ""

# Child Applications (argo-rollouts, traefik) live in Argo CD's namespace and pull upstream charts.
argocdNamespace: argocd

addons:
  argoRollouts:
    chartVersion: 2.43.7        # Argo Rollouts v1.10.1
  traefik:
    chartVersion: 41.7.1        # Traefik v3.7.14; installed only where ingress.className is traefik
  externalSecrets:
    chartVersion: 2.14.0        # External Secrets v2.14.0; installed only where externalSecrets.enabled
  awsLoadBalancerController:
    chartVersion: 3.6.1         # v3.6.1; installed only where ingress.className is alb

ingress:
  className: ""

# Canary analysis (Week 7) queries the central Prometheus with a cb_cell filter: an agent can't answer
# queries, and a second, query-capable Prometheus doesn't fit a 2 GiB cell. If the central Prometheus
# is unreachable, the analysis fails and the canary stops, which is the safe way round.
analysis:
  enabled: false
  prometheusAddress: ""
  maxErrorRate: "0.01"
  maxP95Seconds: "0.3"

# Prometheus agent: pushes to https://metrics.<domain> through Cloudflare Access. Off until the cell has
# a metrics-writer Secret and the central receiver exists: without them it would only fill its WAL.
observability:
  enabled: false
  image: prom/prometheus:v3.14.0
  goMemLimit: 110MiB
  walSizeLimit: 256Mi
  resources:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { memory: 128Mi }
  remoteWrite:
    edgePort: ""              # the twin's edge listens on 8443
    edgeIp: ""                # the twin only: no public DNS for its edge
    caFile: ""                # the twin only: its edge has a private CA

network:
  # Where ingress traffic to the gateway comes from: the controller's namespace (k3s Traefik) or
  # load balancer CIDRs (managed cells set these in their cell values).
  ingressNamespaces: []
  ingressCidrs: []
  # Managed data services (RDS / Cloud SQL / ElastiCache / Memorystore) live outside the cluster.
  dataCidrs: []
  monitoringNamespace: monitoring
  # Where the gateway and inventory-service fetch the Cloudflare Access signing keys (HTTPS to
  # <team>.cloudflareaccess.com, which sits on Cloudflare's published ranges: cloudflare.com/ips).
  accessCidrs:
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22

# Managed profile: cell-db, cell-cache, cell-admin and origin-tls come from the cloud's secret manager
# (Terraform writes them, infra/modules/secret-store). Budget cells get them from Ansible instead.
externalSecrets:
  enabled: false
  provider: ""              # aws | gcp
  region: ""                # aws
  gcpProjectId: ""          # gcp
  originTlsKey: ""          # cb/origin-tls on AWS, cb-origin-tls on GCP

# Budget profile only: Postgres and Valkey run in the cluster. Credentials come from the cell-db /
# cell-cache Secrets that Ansible writes on the VM; Argo CD never sees a password.
budgetData:
  enabled: false
  postgres:
    image: postgres:18.4-alpine
    storage: 5Gi
    resources:
      requests: { cpu: 100m, memory: 160Mi }
      limits: { memory: 256Mi }
  valkey:
    image: valkey/valkey:9.0-alpine
    maxmemory: 48mb
    resources:
      requests: { cpu: 25m, memory: 48Mi }
      limits: { memory: 96Mi }
