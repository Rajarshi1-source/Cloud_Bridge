{{- if .Values.externalSecrets.enabled }}
{{- $prefix := required "cell is set by the cell values" .Values.cell -}}
{{- /*
Managed cells: every Secret the services read comes from the cloud's secret manager. No auth block:
the External Secrets controller's own identity reads them (Pod Identity on EKS, Workload Identity
Federation on GKE; both granted in infra/modules/secret-store).
*/ -}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cell-secrets
spec:
  provider:
    {{- if eq .Values.externalSecrets.provider "aws" }}
    aws:
      service: SecretsManager
      region: {{ required "externalSecrets.region" .Values.externalSecrets.region }}
    {{- else if eq .Values.externalSecrets.provider "gcp" }}
    gcpsm:
      projectID: {{ required "externalSecrets.gcpProjectId" .Values.externalSecrets.gcpProjectId }}
    {{- else }}
    {{- fail "externalSecrets.provider must be aws or gcp" }}
    {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cell-db
spec:
  refreshInterval: 1h
  secretStoreRef: { name: cell-secrets, kind: SecretStore }
  target: { name: cell-db }
  data:
    - secretKey: jdbcUrl
      remoteRef: { key: {{ $prefix }}-cell-config, property: jdbcUrl }
    - secretKey: username
      remoteRef: { key: {{ $prefix }}-db-admin, property: username }
    - secretKey: password
      remoteRef: { key: {{ $prefix }}-db-admin, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cell-cache
spec:
  refreshInterval: 1h
  secretStoreRef: { name: cell-secrets, kind: SecretStore }
  target: { name: cell-cache }
  data:
    - secretKey: url
      remoteRef: { key: {{ $prefix }}-cell-config, property: cacheUrl }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cell-admin
spec:
  refreshInterval: 1h
  secretStoreRef: { name: cell-secrets, kind: SecretStore }
  target: { name: cell-admin }
  data:
    - secretKey: teamDomain
      remoteRef: { key: {{ $prefix }}-cell-config, property: accessTeamDomain }
    - secretKey: audience
      remoteRef: { key: {{ $prefix }}-cell-config, property: accessAudience }
    - secretKey: allowedClientIds
      remoteRef: { key: {{ $prefix }}-cell-config, property: allowedClientIds }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: origin-tls
spec:
  refreshInterval: 24h
  secretStoreRef: { name: cell-secrets, kind: SecretStore }
  target:
    name: origin-tls
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef: { key: {{ required "externalSecrets.originTlsKey" .Values.externalSecrets.originTlsKey }}, property: certificate }
    - secretKey: tls.key
      remoteRef: { key: {{ .Values.externalSecrets.originTlsKey }}, property: private_key }
{{- end }}
{{- if eq .Values.ingress.className "gce" }}
---
# GKE's load balancer takes its health check from here: the readiness probe is on the management port.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: api-gateway
spec:
  healthCheck:
    type: HTTP
    port: 8080
    requestPath: /healthz/cell
{{- end }}
