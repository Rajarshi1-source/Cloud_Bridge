apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: ControlPlane
    uid: controlplane
    type: grafana-postgresql-datasource
    access: proxy
    url: ${CP_DB_HOST}
    user: cp_reader
    jsonData:
      database: controlplane
      sslmode: ${CP_DB_SSLMODE}
      postgresVersion: 1800
    secureJsonData:
      password: $__file{/etc/grafana/secrets/cp_reader_password}
