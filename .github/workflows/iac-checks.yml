# Offline infrastructure checks on every PR that touches IaC: no cloud credentials, no state.
# Runs the same harness developers run locally (tools/dev/iac-check.sh), so CI and laptops agree.
#   terraform: fmt, validate, contract test + offline stack plans (Terraform 1.15)
#   tofu:      validate + the same tests on OpenTofu 1.12 (proves the modules stay engine-agnostic)
#   actions:   actionlint on every workflow
#   gitops:    helm lint + render every chart for every cell, kubeconform (incl. Argo CRDs)
#   ansible:   ansible-lint production profile + playbook syntax check
#   molecule:  k3s_server role converge + idempotence + verify in a container
name: iac-checks

on:
  pull_request:
    paths:
      - "infra/**"
      - "ansible/**"
      - "gitops/**"
      - ".github/workflows/**"
      - "tools/dev/iac-check.sh"
      - "tools/dev/ansible-toolbox.Dockerfile"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "ansible/**"
      - "gitops/**"
      - ".github/workflows/**"
      - "tools/dev/iac-check.sh"
      - "tools/dev/ansible-toolbox.Dockerfile"

permissions:
  contents: read

concurrency:
  group: iac-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [terraform, tofu, actions, gitops, ansible, molecule]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: TEMP print cloudflare provider lock hashes (removed in the next commit)
        if: matrix.check == 'terraform'
        run: |
          mkdir -p "$RUNNER_TEMP/cfl"
          printf 'terraform {\n  required_providers {\n    cloudflare = {\n      source  = "cloudflare/cloudflare"\n      version = "5.28.0"\n    }\n  }\n}\n' > "$RUNNER_TEMP/cfl/main.tf"
          docker run --rm -v "$RUNNER_TEMP/cfl":/w -w /w hashicorp/terraform:1.15.9 providers lock \
            -platform=linux_amd64 -platform=linux_arm64 -platform=darwin_arm64 -platform=windows_amd64
          cat "$RUNNER_TEMP/cfl/.terraform.lock.hcl"

      - name: Run ${{ matrix.check }} checks
        env:
          CHECK: ${{ matrix.check }}
        run: bash tools/dev/iac-check.sh "$CHECK"
