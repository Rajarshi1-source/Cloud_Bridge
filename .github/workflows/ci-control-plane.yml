# Unit tests of the control-plane Python that has no database or cloud dependency in its tests.
name: ci-control-plane

on:
  pull_request:
    paths:
      - "control-plane/**"
      - ".github/workflows/ci-control-plane.yml"
  push:
    branches: [main]
    paths:
      - "control-plane/**"
      - ".github/workflows/ci-control-plane.yml"

permissions:
  contents: read

jobs:
  allocator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Lease allocator unit tests
        working-directory: control-plane/allocator
        run: python -m unittest discover -s tests
